<div class="d-flex main-div">
  <div class="reg-forms">
    <div class="button-header">
      <a href="">←Back</a>
      <!-- <button>Back</button> -->
      <button><span class="blue">Register</span> as Employer</button>
    </div>
    <h1 id="heading-main"><span class="text-black">Create</span> Employee Account</h1>
    <h4 id="message">Fields marked with *are required.</h4>


    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
    <div class="registeration-form">

    <!-- Account Information -->
    <h3 id="heading-account">Account Information</h3>
    <div class="inputs">
      <div>
        <label>First name</label>
        <input type="text" name="firstName" [(ngModel)]="user.firstName" required />
      </div>
      <div>
        <label>Last name</label>
        <input type="text" name="lastName" [(ngModel)]="user.lastName" required />
      </div>
    </div>

    <div class="email-section">
      <label>Email address</label>
      <input type="email" name="email" [(ngModel)]="user.email" required />
    </div>

    <div class="inputs">
      <div>
        <label>Date of birth</label>
        <input type="date" name="dob" [(ngModel)]="user.dob" placeholder="MM/DD/YYYY" />
      </div>
      <div>
        <label>SSN</label>
        <input type="text" name="ssn" [(ngModel)]="user.ssn" />
      </div>
    </div>

    <div class="email-section">
      <label>User ID</label>
      <input type="text" name="userId" [(ngModel)]="user.userId" />
    </div>

    <div class="email-section">
      <label>Password</label>
      <input type="password" name="password" [(ngModel)]="user.password" />
    </div>

    <div class="email-section">
      <label>Confirm password</label>
      <input type="password" name="confirmPassword" [(ngModel)]="user.confirmPassword" />
    </div>
      <!-- </form> -->
    </div>
